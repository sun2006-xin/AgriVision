<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="1200" height="700" fill="#f8faf8"/>
  
  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a5c3a">AgriVision System Architecture</text>
  
  <!-- ESP32-CAM -->
  <rect x="50" y="100" width="180" height="80" rx="12" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="140" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">ESP32-CAM</text>
  <text x="140" y="158" text-anchor="middle" font-size="11" fill="#795548">Edge Image Capture</text>
  <text x="140" y="173" text-anchor="middle" font-size="10" fill="#795548">MJPEG + SD Card</text>
  
  <!-- Camera Stream Arrow -->
  <path d="M 230 140 L 330 140" stroke="#ff9800" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="280" y="132" text-anchor="middle" font-size="10" fill="#e65100">MJPEG</text>
  
  <!-- System B Block -->
  <rect x="340" y="80" width="500" height="380" rx="16" fill="#e8f5e9" stroke="#4caf50" stroke-width="2.5"/>
  <text x="590" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">System B - Real-time Monitoring</text>
  <text x="590" y="130" text-anchor="middle" font-size="12" fill="#558b2f">Flask | Multi-Camera | Dual-Engine Fusion</text>
  
  <!-- OpenCV Engine -->
  <rect x="370" y="155" width="200" height="90" rx="10" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="470" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">OpenCV HSV</text>
  <text x="470" y="205" text-anchor="middle" font-size="11" fill="#33691e">Color Threshold</text>
  <text x="470" y="222" text-anchor="middle" font-size="11" fill="#33691e">Green / Yellow / Brown</text>
  <text x="470" y="237" text-anchor="middle" font-size="10" fill="#558b2f">Zero Latency</text>
  
  <!-- YOLO Engine -->
  <rect x="610" y="155" width="200" height="90" rx="10" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="710" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">YOLOv8n</text>
  <text x="710" y="205" text-anchor="middle" font-size="11" fill="#33691e">Object Detection</text>
  <text x="710" y="222" text-anchor="middle" font-size="11" fill="#33691e">Disease + Pest (2-class)</text>
  <text x="710" y="237" text-anchor="middle" font-size="10" fill="#558b2f">GPU Accelerated</text>
  
  <!-- DualVerifier -->
  <rect x="490" y="270" width="200" height="60" rx="10" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2"/>
  <text x="590" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">DualVerifier</text>
  <text x="590" y="318" text-anchor="middle" font-size="11" fill="#33691e">Fusion &amp; Confidence</text>
  
  <!-- Arrows to DualVerifier -->
  <path d="M 470 245 L 540 270" stroke="#388e3c" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <path d="M 710 245 L 640 270" stroke="#388e3c" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  
  <!-- Alert System -->
  <rect x="370" y="355" width="140" height="70" rx="10" fill="#fff9c4" stroke="#fbc02d" stroke-width="1.5"/>
  <text x="440" y="383" text-anchor="middle" font-size="12" font-weight="bold" fill="#f57f17">DingTalk Alert</text>
  <text x="440" y="400" text-anchor="middle" font-size="10" fill="#f9a825">3-Level Warning</text>
  <text x="440" y="415" text-anchor="middle" font-size="10" fill="#f9a825">Webhook Push</text>
  
  <!-- History -->
  <rect x="530" y="355" width="140" height="70" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="600" y="383" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">History Log</text>
  <text x="600" y="400" text-anchor="middle" font-size="10" fill="#1565c0">SQLite Storage</text>
  <text x="600" y="415" text-anchor="middle" font-size="10" fill="#1565c0">Statistics</text>
  
  <!-- SD Card Sync -->
  <rect x="690" y="355" width="140" height="70" rx="10" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
  <text x="760" y="383" text-anchor="middle" font-size="12" font-weight="bold" fill="#880e4f">SD Card Sync</text>
  <text x="760" y="400" text-anchor="middle" font-size="10" fill="#ad1457">Auto Save</text>
  <text x="760" y="415" text-anchor="middle" font-size="10" fill="#ad1457">Image Backup</text>
  
  <!-- Arrow from DualVerifier to outputs -->
  <path d="M 540 330 L 440 355" stroke="#388e3c" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <path d="M 590 330 L 600 355" stroke="#388e3c" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <path d="M 640 330 L 760 355" stroke="#388e3c" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  
  <!-- REST API Connection -->
  <rect x="880" y="250" width="140" height="50" rx="8" fill="#fff" stroke="#9c27b0" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="950" y="273" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a1b9a">REST API</text>
  <text x="950" y="290" text-anchor="middle" font-size="10" fill="#7b1fa2">/diagnose</text>
  
  <!-- Arrow from System B to REST API -->
  <path d="M 840 290 L 880 275" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="860" y="268" text-anchor="middle" font-size="9" fill="#6a1b9a">Deep</text>
  <text x="860" y="280" text-anchor="middle" font-size="9" fill="#6a1b9a">Diagnose</text>
  
  <!-- System A Block -->
  <rect x="340" y="490" width="500" height="180" rx="16" fill="#e3f2fd" stroke="#2196f3" stroke-width="2.5"/>
  <text x="590" y="520" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">System A - AI Diagnosis Station</text>
  <text x="590" y="540" text-anchor="middle" font-size="12" fill="#1976d2">FastAPI | 5-Engine Ensemble | ONNX Runtime</text>
  
  <!-- 5 Engines in System A -->
  <rect x="360" y="560" width="85" height="55" rx="8" fill="#bbdefb" stroke="#1976d2" stroke-width="1.2"/>
  <text x="402" y="582" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">ResNet-18</text>
  <text x="402" y="597" text-anchor="middle" font-size="9" fill="#1565c0">12-Class</text>
  <text x="402" y="609" text-anchor="middle" font-size="9" fill="#1565c0">ONNX</text>
  
  <rect x="455" y="560" width="85" height="55" rx="8" fill="#bbdefb" stroke="#1976d2" stroke-width="1.2"/>
  <text x="497" y="582" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">YOLOv8n</text>
  <text x="497" y="597" text-anchor="middle" font-size="9" fill="#1565c0">Detection</text>
  <text x="497" y="609" text-anchor="middle" font-size="9" fill="#1565c0">2-Class</text>
  
  <rect x="550" y="560" width="85" height="55" rx="8" fill="#bbdefb" stroke="#1976d2" stroke-width="1.2"/>
  <text x="592" y="582" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">YOLOv8-seg</text>
  <text x="592" y="597" text-anchor="middle" font-size="9" fill="#1565c0">Segment</text>
  <text x="592" y="609" text-anchor="middle" font-size="9" fill="#1565c0">COCO</text>
  
  <rect x="645" y="560" width="85" height="55" rx="8" fill="#bbdefb" stroke="#1976d2" stroke-width="1.2"/>
  <text x="687" y="582" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">CLIP</text>
  <text x="687" y="597" text-anchor="middle" font-size="9" fill="#1565c0">Zero-Shot</text>
  <text x="687" y="609" text-anchor="middle" font-size="9" fill="#1565c0">Chinese</text>
  
  <rect x="740" y="560" width="85" height="55" rx="8" fill="#bbdefb" stroke="#1976d2" stroke-width="1.2"/>
  <text x="782" y="582" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">Qwen2-VL</text>
  <text x="782" y="597" text-anchor="middle" font-size="9" fill="#1565c0">LLM Report</text>
  <text x="782" y="609" text-anchor="middle" font-size="9" fill="#1565c0">Multimodal</text>
  
  <!-- Arrow from REST API to System A -->
  <path d="M 950 300 L 950 490 L 750 560" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrowPurple)" fill="none"/>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9800"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#388e3c"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9c27b0"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="950" y="550" width="220" height="120" rx="8" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="1060" y="575" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Legend</text>
  <rect x="965" y="590" width="16" height="16" rx="3" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
  <text x="990" y="603" font-size="10" fill="#555">System B (Flask)</text>
  <rect x="965" y="615" width="16" height="16" rx="3" fill="#e3f2fd" stroke="#2196f3" stroke-width="1"/>
  <text x="990" y="628" font-size="10" fill="#555">System A (FastAPI)</text>
  <rect x="965" y="640" width="16" height="16" rx="3" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="990" y="653" font-size="10" fill="#555">Edge Device</text>
</svg>
